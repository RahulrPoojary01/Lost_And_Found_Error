<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusFound - Campus Lost & Found</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        matcha: {
                            50: '#F5F9F6', 100: '#E8F2EB', 200: '#D1E5D5', 300: '#AFD1B5',
                            400: '#85B68E', 500: '#649A6E', 600: '#4D7A55', 700: '#3E6144',
                            800: '#334F37', 900: '#2B412F',
                        },
                        cream: {
                            50: '#FDFBF7', 100: '#FBF7EE', 200: '#F5EEDC', 300: '#EFE3C6', 500: '#D8BC83',
                        }
                    },
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="h-full bg-cream-50 text-matcha-900 font-sans antialiased flex flex-col justify-between">

    <!-- Header Navigation -->
    <header class="sticky top-0 z-40 bg-cream-100/90 backdrop-blur-md border-b border-matcha-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-18 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="switchTab('home')">
                <div class="w-10 h-10 rounded-xl bg-matcha-500 flex items-center justify-center text-cream-50 shadow-md">
                    <i data-lucide="leaf" class="w-6 h-6"></i>
                </div>
                <div>
                    <span class="text-xl font-bold tracking-tight text-matcha-900">Campus<span class="text-matcha-500">Found</span></span>
                    <p class="text-xs text-matcha-700 font-medium">Lost & Found System</p>
                </div>
            </div>

            <div class="flex items-center space-x-3">
                <button onclick="switchTab('home')" id="nav-home" class="px-3.5 py-2 rounded-xl text-sm font-semibold transition bg-matcha-200 text-matcha-900 flex items-center space-x-1.5">
                    <i data-lucide="home" class="w-4 h-4"></i><span>Home</span>
                </button>
                <button onclick="switchTab('items')" id="nav-items" class="px-3.5 py-2 rounded-xl text-sm font-semibold transition text-matcha-800 hover:bg-matcha-100 flex items-center space-x-1.5">
                    <i data-lucide="grid" class="w-4 h-4"></i><span>Browse Items</span>
                </button>
                <button onclick="openPostModal()" class="px-4 py-2.5 rounded-xl bg-matcha-600 hover:bg-matcha-700 text-cream-50 font-semibold text-sm shadow-md transition flex items-center space-x-2">
                    <i data-lucide="plus-circle" class="w-4 h-4"></i><span>Report Found Item</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Body -->
    <main class="flex-grow">
        
        <!-- HOME TAB -->
        <div id="tab-home" class="space-y-12 pb-16">
            <section class="relative bg-gradient-to-b from-matcha-100/60 to-cream-50 py-16 sm:py-24 border-b border-matcha-200/50">
                <div class="max-w-5xl mx-auto px-4 text-center space-y-6">
                    <h1 class="text-4xl sm:text-6xl font-extrabold text-matcha-900 tracking-tight leading-tight">
                        Lost something on campus? <br><span class="text-matcha-600">Let's get it back to you.</span>
                    </h1>
                    <p class="text-lg text-matcha-800 max-w-2xl mx-auto">A seamless platform to reconnect campus members with their belongings.</p>
                    <div class="flex justify-center gap-4">
                        <button onclick="switchTab('items')" class="px-6 py-3.5 rounded-2xl bg-matcha-600 hover:bg-matcha-700 text-cream-50 font-bold shadow-md transition">Browse All Items</button>
                        <button onclick="openPostModal()" class="px-6 py-3.5 rounded-2xl bg-cream-200 hover:bg-cream-300 text-matcha-900 font-bold border border-matcha-300 transition">I Found Something</button>
                    </div>
                </div>
            </section>

            <section class="max-w-7xl mx-auto px-4">
                <h2 class="text-2xl font-bold text-matcha-900 mb-6">Recently Reported Items</h2>
                <div id="home-featured-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            </section>
        </div>

        <!-- ITEMS TAB -->
        <div id="tab-items" class="max-w-7xl mx-auto px-4 py-8 hidden space-y-8">
            <div class="bg-cream-100 p-6 rounded-3xl border border-matcha-200 shadow-sm flex flex-col md:flex-row justify-between gap-4">
                <div>
                    <h1 class="text-2xl font-bold text-matcha-900">Directory</h1>
                    <p class="text-sm text-matcha-700">Search and filter registered items</p>
                </div>
                <input type="text" id="search-input" oninput="renderItems()" placeholder="Search item name or location..." class="w-full md:w-80 px-4 py-2.5 rounded-xl bg-cream-50 border border-matcha-200 text-sm focus:outline-none focus:ring-2 focus:ring-matcha-500">
            </div>
            <div id="items-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            <div id="empty-state" class="hidden text-center py-16 bg-cream-100 rounded-3xl border border-matcha-200">
                <h3 class="text-lg font-bold text-matcha-900">No items found</h3>
            </div>
        </div>
    </main>

    <!-- CLAIM MODAL -->
    <div id="claim-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-matcha-950/40 backdrop-blur-xs hidden">
        <div class="bg-cream-50 rounded-3xl max-w-md w-full border border-matcha-200 shadow-2xl p-6">
            <h3 class="text-lg font-bold text-matcha-900 mb-4">Verify Ownership to Claim</h3>
            <form id="claim-form" onsubmit="handleClaimSubmit(event)" class="space-y-4">
                <input type="hidden" id="claim-item-id">
                <input type="text" id="claim-name" required placeholder="Full Name" class="w-full px-4 py-2.5 rounded-xl bg-cream-100 border border-matcha-200 text-sm">
                <input type="text" id="claim-branch" required placeholder="Department / Branch" class="w-full px-4 py-2.5 rounded-xl bg-cream-100 border border-matcha-200 text-sm">
                <select id="claim-year" required class="w-full px-4 py-2.5 rounded-xl bg-cream-100 border border-matcha-200 text-sm">
                    <option value="1st Year">1st Year</option><option value="2nd Year">2nd Year</option>
                    <option value="3rd Year">3rd Year</option><option value="4th Year">4th Year</option>
                </select>
                <input type="text" id="claim-usn" required placeholder="USN / Roll Number" class="w-full px-4 py-2.5 rounded-xl bg-cream-100 border border-matcha-200 text-sm">
                <div class="flex justify-end space-x-3 pt-2">
                    <button type="button" onclick="closeClaimModal()" class="px-4 py-2 bg-matcha-100 rounded-xl text-xs font-bold">Cancel</button>
                    <button type="submit" class="px-5 py-2 bg-matcha-600 text-cream-50 rounded-xl text-xs font-bold">Submit Claim</button>
                </div>
            </form>
        </div>
    </div>

    <!-- REPORT FOUND ITEM MODAL -->
    <div id="post-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-matcha-950/40 backdrop-blur-xs hidden">
        <div class="bg-cream-50 rounded-3xl max-w-md w-full border border-matcha-200 shadow-2xl p-6">
            <h3 class="text-lg font-bold text-matcha-900 mb-4">Report a Found Item</h3>
            <form id="post-form" onsubmit="handlePostSubmit(event)" class="space-y-4">
                <input type="text" id="post-title" required placeholder="Item Title (e.g. Casio Scientific Calculator)" class="w-full px-4 py-2.5 rounded-xl bg-cream-100 border border-matcha-200 text-sm">
                <select id="post-category" required class="w-full px-4 py-2.5 rounded-xl bg-cream-100 border border-matcha-200 text-sm">
                    <option value="Electronics">Electronics</option>
                    <option value="Valuables">Valuables</option>
                    <option value="Miscellaneous">Miscellaneous</option>
                </select>
                <input type="text" id="post-location" required placeholder="Location Found (e.g. Audi 1)" class="w-full px-4 py-2.5 rounded-xl bg-cream-100 border border-matcha-200 text-sm">
                <input type="text" id="post-date" required placeholder="Date Found (e.g. Oct 16, 2026)" class="w-full px-4 py-2.5 rounded-xl bg-cream-100 border border-matcha-200 text-sm">
                <textarea id="post-desc" required placeholder="Description (color, brand, distinguishing marks)" class="w-full px-4 py-2.5 rounded-xl bg-cream-100 border border-matcha-200 text-sm"></textarea>
                <input type="url" id="post-image" placeholder="Image URL (optionalunsplash link)" class="w-full px-4 py-2.5 rounded-xl bg-cream-100 border border-matcha-200 text-sm">
                <div class="flex justify-end space-x-3 pt-2">
                    <button type="button" onclick="closePostModal()" class="px-4 py-2 bg-matcha-100 rounded-xl text-xs font-bold">Cancel</button>
                    <button type="submit" class="px-5 py-2 bg-matcha-600 text-cream-50 rounded-xl text-xs font-bold">Post Item</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JAVASCRIPT & FETCH LOGIC -->
    <script>
        const API_URL = 'http://127.0.0.1:5000';
        let allItems = [];

        function switchTab(tabId) {
            document.getElementById('tab-home').classList.add('hidden');
            document.getElementById('tab-items').classList.add('hidden');
            if (tabId === 'home') document.getElementById('tab-home').classList.remove('hidden');
            if (tabId === 'items') {
                document.getElementById('tab-items').classList.remove('hidden');
                renderItems();
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function fetchItemsFromDB() {
            fetch(`${API_URL}/api/items`)
                .then(res => res.json())
                .then(data => {
                    allItems = data;
                    renderItems();
                    renderHomeFeatured();
                })
                .catch(err => console.error("Error fetching items:", err));
        }

        function renderItems() {
            const grid = document.getElementById('items-grid');
            const searchQuery = document.getElementById('search-input').value.toLowerCase();
            grid.innerHTML = '';
            const filtered = allItems.filter(i => i.title.toLowerCase().includes(searchQuery) || i.location.toLowerCase().includes(searchQuery));
            
            filtered.forEach(item => {
                const isClaimed = item.status === 'Claimed';
                grid.innerHTML += `
                    <div class="bg-cream-100 border border-matcha-200 rounded-3xl overflow-hidden shadow-sm flex flex-col justify-between">
                        <div>
                            <img src="${item.image_url}" alt="${item.title}" class="w-full h-48 object-cover">
                            <div class="p-6 space-y-2">
                                <span class="text-xs font-bold text-matcha-600 uppercase">${item.category}</span>
                                <h3 class="text-lg font-bold text-matcha-900">${item.title}</h3>
                                <p class="text-xs text-matcha-700">📍 ${item.location} • 📅 ${item.date}</p>
                                <p class="text-sm text-matcha-800">${item.description}</p>
                            </div>
                        </div>
                        <div class="p-6 pt-0">
                            <button onclick="openClaimModal(${item.id})" class="w-full py-3 rounded-xl font-bold text-xs uppercase transition ${isClaimed ? 'bg-matcha-200 text-matcha-600 cursor-not-allowed' : 'bg-matcha-600 hover:bg-matcha-700 text-cream-50'}" ${isClaimed ? 'disabled' : ''}>
                                ${isClaimed ? 'Item Claimed' : 'Claim This Item'}
                            </button>
                        </div>
                    </div>`;
            });
            lucide.createIcons();
        }

        function renderHomeFeatured() {
            const homeGrid = document.getElementById('home-featured-grid');
            homeGrid.innerHTML = '';
            allItems.slice(0, 3).forEach(item => {
                const isClaimed = item.status === 'Claimed';
                homeGrid.innerHTML += `
                    <div class="bg-cream-100 border border-matcha-200 rounded-3xl overflow-hidden shadow-sm flex flex-col justify-between">
                        <img src="${item.image_url}" alt="${item.title}" class="w-full h-48 object-cover">
                        <div class="p-6 space-y-2">
                            <span class="text-xs font-bold text-matcha-600 uppercase">${item.category}</span>
                            <h3 class="text-lg font-bold text-matcha-900">${item.title}</h3>
                            <p class="text-xs text-matcha-700">📍 ${item.location}</p>
                        </div>
                        <div class="p-6 pt-0">
                            <button onclick="openClaimModal(${item.id})" class="w-full py-3 rounded-xl font-bold text-xs uppercase transition ${isClaimed ? 'bg-matcha-200 text-matcha-600' : 'bg-matcha-600 text-cream-50'}" ${isClaimed ? 'disabled' : ''}>
                                ${isClaimed ? 'Item Claimed' : 'Claim This Item'}
                            </button>
                        </div>
                    </div>`;
            });
            lucide.createIcons();
        }

        function openClaimModal(id) {
            document.getElementById('claim-item-id').value = id;
            document.getElementById('claim-modal').classList.remove('hidden');
        }
        function closeClaimModal() { document.getElementById('claim-modal').classList.add('hidden'); }

        function openPostModal() { document.getElementById('post-modal').classList.remove('hidden'); }
        function closePostModal() { document.getElementById('post-modal').classList.add('hidden'); }

        // SUBMIT NEW ITEM TO BACKEND VIA FETCH
        function handlePostSubmit(e) {
            e.preventDefault();
            const newItem = {
                title: document.getElementById('post-title').value,
                category: document.getElementById('post-category').value,
                location: document.getElementById('post-location').value,
                date: document.getElementById('post-date').value,
                description: document.getElementById('post-desc').value,
                image_url: document.getElementById('post-image').value || 'https://images.unsplash.com/photo-1584438784894-089d6a62b8fa?w=600&auto=format&fit=crop&q=80'
            };

            fetch(`${API_URL}/api/items`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(newItem)
            })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    alert('Item reported successfully!');
                    closePostModal();
                    document.getElementById('post-form').reset();
                    fetchItemsFromDB();
                }
            });
        }

        function handleClaimSubmit(e) {
            e.preventDefault();
            const claim = {
                item_id: document.getElementById('claim-item-id').value,
                full_name: document.getElementById('claim-name').value,
                department: document.getElementById('claim-branch').value,
                year: document.getElementById('claim-year').value,
                usn: document.getElementById('claim-usn').value
            };
            fetch(`${API_URL}/api/claim`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(claim)
            }).then(res => res.json()).then(data => {
                if(data.success) {
                    alert('Claim submitted!');
                    closeClaimModal();
                    fetchItemsFromDB();
                }
            });
        }

        window.onload = () => { fetchItemsFromDB(); };
    </script>
</body>
</html>
